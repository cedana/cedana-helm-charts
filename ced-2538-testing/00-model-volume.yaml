# CED-2538: the model volume for the GLM-5.2 TTFT-tail investigation.
# PVCs are per namespace and
# cedana-systems has none, so this PV copies the csi block of cedana-provisioning/model-preload-access
# (same Weka snapshot view as default/hf-models-rwx) and the PVC binds to it. Read-only at the pod
# mount, not in the csi block: the Weka driver only resolves the sv- view on a normal publish.
# Reclaim is Retain, so deleting these touches no data.
#
# Apply once, before either server:
#   kubectl apply -f 00-model-volume.yaml
#
# If a PV named gip-models-ro already exists from the GIP work, this one conflicts by name but
# carries an identical csi block and a claimRef to the same namespace/name, so reuse that one
# instead and skip this file. Check first:
#   kubectl get pv gip-models-ro -o jsonpath='{.spec.claimRef.namespace}/{.spec.claimRef.name}{"\n"}'
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gip-models-ro
spec:
  accessModes: [ReadWriteMany]
  capacity: {storage: 8Ti}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: shared-wekafs
  volumeMode: Filesystem
  claimRef: {name: hf-models-rwx, namespace: cedana-systems}
  csi:
    driver: csi.weka.io
    volumeHandle: weka/v2/440b833c-b593-47bc-ac24-8e2c653d/sv-8e54dab7-6041-48af-a2ec-ca204bc6b3bd
    volumeAttributes: {filesystemName: 440b833c-b593-47bc-ac24-8e2c653d, volumeType: weka/v2}
    controllerExpandSecretRef: {name: weka-csi-secret, namespace: weka-operator-system}
    controllerPublishSecretRef: {name: weka-csi-secret, namespace: weka-operator-system}
    nodePublishSecretRef: {name: weka-csi-secret, namespace: weka-operator-system}
    nodeStageSecretRef: {name: weka-csi-secret, namespace: weka-operator-system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-models-rwx
  namespace: cedana-systems
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 8Ti}}
  storageClassName: shared-wekafs
  volumeName: gip-models-ro
