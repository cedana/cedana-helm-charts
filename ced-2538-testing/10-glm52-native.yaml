# CED-2538: GLM-5.2 on SGLang TP8, NATIVE (no cedana). The A-side of the A/B.
#
# The engine flags follow cedana-bench/k8s/together-manifests/glm-5-3-p1-b200.yaml and
# .../variants/hicache-probe-128.yaml, which are the in-repo manifests that actually ran stock
# upstream sglang with a hierarchical cache on a B200. 11-glm52-cedana.yaml is this file plus
# runtimeClassName and four env vars.
#
#   kubectl apply -n cedana-systems -f 10-glm52-native.yaml
#
# ---------------------------------------------------------------------------------------------
# WHY THESE FLAG VALUES, AND THE ONE THAT MATTERS MOST
#
# --hicache-size 128        128 GiB of PINNED HOST MEMORY. This is the pool the whole investigation
#                           is about, so it has to be sized explicitly; the alternative knob
#                           (--hicache-ratio, relative to GPU KV) leaves the host pool implicit and
#                           makes two runs incomparable. 128 matches hicache-probe-128.yaml and
#                           glm-5-3-p1-b200.yaml. hicache-probe-000.yaml is the control with the
#                           cache off -- worth a third run if the tail tracks pool size.
#
# --hicache-io-backend      THE VARIABLE TO SWEEP. It decides HOW the host tier is read back, and
#                           therefore whether the copies are interposable at all:
#                             direct -> cudaMemcpyAsync, i.e. cuMemcpyHtoDAsync_v2, which is
#                                       exactly what bpf/cuda-copy-hist.bt probes and what the
#                                       16 MiB staging split in hooks/driver_api.cpp:2453 applies to
#                             kernel -> a device kernel reads the pinned host pool directly, so
#                                       load-back shows up as kernel launches and NOT as cuMemcpy
#                           If the tail appears on `direct` and vanishes on `kernel`, it is in the
#                           copy path; if it follows both, it is not. Run `direct` first: it is the
#                           one the probes can see. hicache-probe-128.yaml uses `direct`.
#
# --hicache-write-policy    write_through_selective, matching both in-repo manifests. Switch to
#                           write_through if stage C's re-sends come back with cached_tokens ~= 0
#                           (nothing reached the host tier, so there was nothing to load back).
#
# --mem-fraction-static     0.85, from glm-5-3-p1-b200.yaml, which is a proven value UNDER cedana
#                           on a B200 (the interceptor's arena takes GPU memory too). Lower it if
#                           the engine OOMs during startup -- and lower it on BOTH sides together.
#
# Radix cache stays ON -- do not disable it, or nothing is ever evicted to the host tier and
# stage C measures nothing.
# ---------------------------------------------------------------------------------------------
#
# VERIFY BEFORE THE FIRST RUN -- does this image serve GLM-5.2? Production runs Together's private
# SMG build, and the in-repo B200 hicache probes used v0.5.20-cu130, so v0.5.15.post1-cu129 is
# older than either. Check the model loads AND that sm_100 kernels are present before a long run:
#   kubectl -n cedana-systems run glmchk --rm -it --restart=Never \
#     --image=lmsysorg/sglang:v0.5.15.post1-cu129 -- \
#     python3 -c "from transformers import AutoConfig; print(AutoConfig.from_pretrained('zai-org/GLM-5.2', trust_remote_code=True).model_type)"
# And confirm the hicache flag names on this exact tag:
#   kubectl -n cedana-systems run glmchk --rm -it --restart=Never \
#     --image=lmsysorg/sglang:v0.5.15.post1-cu129 -- \
#     bash -c "python3 -m sglang.launch_server --help | grep -i hicache"
apiVersion: v1
kind: Pod
metadata:
  name: glm52-native
  namespace: cedana-systems
  labels:
    app: glm52-native
    ced-2538/side: native
  annotations:
    ced-2538/hicache-gb: "128"
    ced-2538/hicache-io-backend: "direct"
spec:
  restartPolicy: Never
  nodeName: gpu-dp-ckck8-4pcmf   # both sides pinned here: same hardware, or the A/B compares nodes
  terminationGracePeriodSeconds: 120   # the engine needs time to flush on SIGTERM
  # One 8-GPU pod at a time, both sides on the same node (see nodeName above).

  containers:
  - name: server
    image: lmsysorg/sglang:v0.5.15.post1-cu129
    imagePullPolicy: IfNotPresent
    # Keep the container alive after sglang exits so flushed logs survive for kubectl cp (an
    # emptyDir dies with the pod). Stop the server with:
    #   kubectl -n cedana-systems exec glm52-native -- pkill -TERM -f sglang.launch_server
    command: ["bash", "-c"]
    args:
    - |
      set -o pipefail
      # Resolve the Hub snapshot directory instead of hardcoding a hash; 01-model-fetch.yaml puts
      # it here. Override with MODEL_PATH.
      if [ -z "${MODEL_PATH:-}" ]; then
        MODEL_PATH=$(ls -d /data/modelpreload/huggingface/models--*GLM-5.2*/snapshots/*/ 2>/dev/null | head -1)
      fi
      if [ -z "$MODEL_PATH" ]; then
        echo "[ced-2538] no GLM-5.2 snapshot under /data/modelpreload/huggingface; available:"
        ls -d /data/modelpreload/huggingface/models--* 2>/dev/null | sed 's/^/  /'
        echo "[ced-2538] run 01-model-fetch.yaml first, or set MODEL_PATH"
        sleep infinity
      fi
      echo "[ced-2538] serving $MODEL_PATH"
      python3 -m sglang.launch_server \
        --model-path "$MODEL_PATH" \
        --served-model-name zai-org/GLM-5.2 \
        --tp-size 8 \
        --host 0.0.0.0 \
        --port 30000 \
        --context-length 262144 \
        --trust-remote-code \
        --kv-cache-dtype fp8_e4m3 \
        --mem-fraction-static 0.85 \
        --chunked-prefill-size 8192 \
        --max-running-requests 32 \
        --enable-hierarchical-cache \
        --hicache-size 128 \
        --hicache-write-policy write_through_selective \
        --hicache-io-backend direct \
        --enable-metrics \
        --enable-cache-report \
        --enable-request-time-stats-logging \
        2>&1 | tee /logs/server.log
      echo '[ced-2538] server exited; logs ready in /logs'
      sleep infinity
    env:
    - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION   # no /health generation during forward
      value: "0"
    - name: HF_HOME
      value: /data/modelpreload/huggingface
    - name: HF_HUB_CACHE            # volume root holds models--org--name/ directly (cedana's layout)
      value: /data/modelpreload/huggingface
    - name: HUGGINGFACE_HUB_CACHE
      value: /data/modelpreload/huggingface
    - name: HF_HUB_OFFLINE          # the volume is read-only here; 01-model-fetch.yaml does the pull
      value: "1"
    - name: SGLANG_DG_CACHE_DIR     # DeepGEMM compiles into a writable dir, not the RO volume
      value: /tmp/dg-cache
    - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
      value: "1"
    # Transport evidence, question 2: NCCL states its per-channel transport choice once at init
    # ("via P2P/IPC", "via SHM/direct", "via NET/IB"). Free, one-time, definitive; bpf/transport.bt
    # corroborates it at the driver-call level. Identical on both sides.
    - name: NCCL_DEBUG
      value: "INFO"
    - name: NCCL_DEBUG_SUBSYS
      value: "INIT,GRAPH,TUNING"
    ports:
    - containerPort: 30000
    resources:
      limits:
        nvidia.com/gpu: 8
    volumeMounts:
    - {name: logs, mountPath: /logs}
    - {name: models, mountPath: /data/modelpreload/huggingface}   # PVC root is the Hub cache
    - {name: dshm, mountPath: /dev/shm}
    readinessProbe:               # /health runs a generation and outlives the 1 s default timeout
      httpGet: {path: /get_model_info, port: 30000}
      initialDelaySeconds: 120
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 480       # GLM-5.2 cold start from Weka is slow; budget ~2 h
  volumes:
  - name: logs
    emptyDir: {}
  - name: models
    persistentVolumeClaim: {claimName: hf-models-rwx, readOnly: true}
  - name: dshm
    # NCCL segments live here. HiCache's 128 GiB is its own pinned pool, NOT /dev/shm, but keep
    # this identical on both sides regardless.
    emptyDir: {medium: Memory, sizeLimit: 64Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: glm52-native
  namespace: cedana-systems
spec:
  selector:
    app: glm52-native
  ports:
  - {port: 30000, targetPort: 30000}
