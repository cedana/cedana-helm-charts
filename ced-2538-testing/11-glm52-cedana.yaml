# CED-2538: GLM-5.2 on SGLang TP8, UNDER CEDANA. The B-side of the A/B.
#
# GENERATED FROM 10-glm52-native.yaml by applying exactly the deltas below. Every engine flag is
# byte-identical to the native side -- verified structurally, not by eye. Re-check after any edit:
#   python3 -c "
#   import yaml;n,c=[list(yaml.safe_load_all(open(f)))[0] for f in ('10-glm52-native.yaml','11-glm52-cedana.yaml')]
#   print(n['spec']['containers'][0]['args']==c['spec']['containers'][0]['args'] or 'ARGS DIFFER')"
#
#   1. runtimeClassName: cedana                      -- the opt-in (templates/runtime-class.yaml)
#   2. serviceAccountName / automountServiceAccountToken -- as cedana-bench's glm-5.2-p1.yaml
#   3. CEDANA_PERSISTENT_MOUNTS / CEDANA_CRIU_OPTS   -- values from variants/hicache-probe-128.yaml,
#      which includes the JIT cache dirs: triton's launcher .so must survive C/R, and triton cache
#      state also changes module-load behaviour, one of the things under investigation here
#   4. CEDANA_GPU_PROFILING_ENABLED / CEDANA_GPU_LOG_DIR + one mkdir for the log dir
#   5. pod/service name and labels
#
# Why 4 needs no chart change: the interceptor is LD_PRELOADed into the application's own process
# and reads these with plain getenv (cuda_tsc_profiler.cpp:35, cuda_intercepter.cpp:165). So the
# client half is instrumented from the workload spec alone -- no values.yaml edit, no daemon
# restart, nothing touched in the cedana install. Controller/worker-side env would need the helper
# DaemonSet instead (README, "What we cannot set from here").
#
# The TSC profile is written per thread ON SIGTERM ONLY. Always stop the server with:
#   kubectl -n cedana-systems exec glm52-cedana -- pkill -TERM -f sglang.launch_server
# Deleting the pod, an OOM kill, or activeDeadlineSeconds loses the profile entirely.
#
#   kubectl apply -n cedana-systems -f 11-glm52-cedana.yaml
apiVersion: v1
kind: Pod
metadata:
  name: glm52-cedana
  namespace: cedana-systems
  labels:
    app: glm52-cedana
    ced-2538/side: cedana
  annotations:
    ced-2538/hicache-gb: "128"
    ced-2538/hicache-io-backend: "direct"
spec:
  restartPolicy: Never
  nodeName: gpu-dp-ckck8-4pcmf   # both sides pinned here: same hardware, or the A/B compares nodes
  runtimeClassName: cedana
  serviceAccountName: cedana-tester
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 120   # the engine needs time to flush on SIGTERM
  # One 8-GPU pod at a time, both sides on the same node (see nodeName above).

  containers:
  - name: server
    image: lmsysorg/sglang:v0.5.15.post1-cu129
    imagePullPolicy: IfNotPresent
    # Keep the container alive after sglang exits so flushed logs survive for kubectl cp (an
    # emptyDir dies with the pod). Stop the server with:
    #   kubectl -n cedana-systems exec glm52-cedana -- pkill -TERM -f sglang.launch_server
    command: ["bash", "-c"]
    args:
    - |
      set -o pipefail
      # Resolve the Hub snapshot directory instead of hardcoding a hash; 01-model-fetch.yaml puts
      # it here. Override with MODEL_PATH.
      if [ -z "${MODEL_PATH:-}" ]; then
        MODEL_PATH=$(ls -d /data/modelpreload/huggingface/models--*GLM-5.2*/snapshots/*/ 2>/dev/null | head -1)
      fi
      if [ -z "$MODEL_PATH" ]; then
        echo "[ced-2538] no GLM-5.2 snapshot under /data/modelpreload/huggingface; available:"
        ls -d /data/modelpreload/huggingface/models--* 2>/dev/null | sed 's/^/  /'
        echo "[ced-2538] run 01-model-fetch.yaml first, or set MODEL_PATH"
        sleep infinity
      fi
      mkdir -p /logs/cedana
      echo "[ced-2538] serving $MODEL_PATH"
      python3 -m sglang.launch_server \
        --model-path "$MODEL_PATH" \
        --served-model-name zai-org/GLM-5.2 \
        --tp-size 8 \
        --host 0.0.0.0 \
        --port 30000 \
        --context-length 262144 \
        --trust-remote-code \
        --kv-cache-dtype fp8_e4m3 \
        --mem-fraction-static 0.85 \
        --chunked-prefill-size 8192 \
        --max-running-requests 32 \
        --enable-hierarchical-cache \
        --hicache-size 128 \
        --hicache-write-policy write_through_selective \
        --hicache-io-backend direct \
        --enable-metrics \
        --enable-cache-report \
        --enable-request-time-stats-logging \
        2>&1 | tee /logs/server.log
      echo '[ced-2538] server exited; logs ready in /logs'
      sleep infinity
    env:
    - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION   # no /health generation during forward
      value: "0"
    - name: HF_HOME
      value: /data/modelpreload/huggingface
    - name: HF_HUB_CACHE            # volume root holds models--org--name/ directly (cedana's layout)
      value: /data/modelpreload/huggingface
    - name: HUGGINGFACE_HUB_CACHE
      value: /data/modelpreload/huggingface
    - name: HF_HUB_OFFLINE          # the volume is read-only here; 01-model-fetch.yaml does the pull
      value: "1"
    - name: SGLANG_DG_CACHE_DIR     # DeepGEMM compiles into a writable dir, not the RO volume
      value: /tmp/dg-cache
    - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
      value: "1"
    # Transport evidence, question 2: NCCL states its per-channel transport choice once at init
    # ("via P2P/IPC", "via SHM/direct", "via NET/IB"). Free, one-time, definitive; bpf/transport.bt
    # corroborates it at the driver-call level. Identical on both sides.
    - name: NCCL_DEBUG
      value: "INFO"
    - name: NCCL_DEBUG_SUBSYS
      value: "INIT,GRAPH,TUNING"
    # --- cedana-only, delta 3 ---
    - {name: CEDANA_PERSISTENT_MOUNTS, value: "/dev/shm,/root/.triton,/root/.cache,/root/.nv"}
    - {name: CEDANA_CRIU_OPTS,         value: '{"link_remap": true, "tcp_established": true}'}
    # --- cedana-only, delta 4: interceptor TSC profile, dumped per thread on SIGTERM ---
    # Count + total duration per driver function. Averages only, so it shows the call MIX (is
    # cuMemcpyHtoDAsync_v2 called 50x more often than native?) but cannot show a tail -- a 60 s
    # stall among millions of calls does not move a mean. bpf/cuda-copy-hist.bt sees the tail.
    - {name: CEDANA_GPU_PROFILING_ENABLED, value: "1"}
    - {name: CEDANA_GPU_LOG_DIR,           value: "/logs/cedana"}
    ports:
    - containerPort: 30000
    resources:
      limits:
        nvidia.com/gpu: 8
    volumeMounts:
    - {name: logs, mountPath: /logs}
    - {name: models, mountPath: /data/modelpreload/huggingface}   # PVC root is the Hub cache
    - {name: dshm, mountPath: /dev/shm}
    readinessProbe:               # /health runs a generation and outlives the 1 s default timeout
      httpGet: {path: /get_model_info, port: 30000}
      initialDelaySeconds: 120
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 480       # GLM-5.2 cold start from Weka is slow; budget ~2 h
  volumes:
  - name: logs
    emptyDir: {}
  - name: models
    persistentVolumeClaim: {claimName: hf-models-rwx, readOnly: true}
  - name: dshm
    # NCCL segments live here. HiCache's 128 GiB is its own pinned pool, NOT /dev/shm, but keep
    # this identical on both sides regardless.
    emptyDir: {medium: Memory, sizeLimit: 64Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: glm52-cedana
  namespace: cedana-systems
spec:
  selector:
    app: glm52-cedana
  ports:
  - {port: 30000, targetPort: 30000}
