apiVersion: v1
kind: Pod
metadata:
  name: ced2538-watcher
  namespace: cedana-systems
  labels:
    app: ced2538-watcher
spec:
  restartPolicy: Never
  hostPID: true
  nodeName: gpu-dp-ckck8-4pcmf
  containers:
  - name: bpf
    image: lmsysorg/sglang:v0.5.15.post1-cu129
    command:
    - bash
    - -c
    args:
    - "if ! command -v bpftrace >/dev/null; then\n  echo \"[ced-2538] installing bpftrace\"\
      \n  apt-get update -qq && apt-get install -y -qq bpftrace || true\nfi\nif !\
      \ command -v bpftrace >/dev/null; then\n  echo \"[ced-2538] no bpftrace and\
      \ apt failed (no egress?). Check the host has one:\"\n  echo \"           nsenter\
      \ -t 1 -m -- bpftrace --version\"\n  sleep infinity\nfi\nbpftrace --version\n\
      exec sh /watcher/attach.sh /bpf/cuda-copy-hist.bt /bpf/transport.bt\n"
    env:
    - name: OUTDIR
      value: /out
    - name: SIDE
      value: auto
    - name: DURATION
      value: '0'
    securityContext:
      privileged: true
    volumeMounts:
    - name: out
      mountPath: /out
    - name: bpf
      mountPath: /bpf
    - name: watcher
      mountPath: /watcher
    - name: debugfs
      mountPath: /sys/kernel/debug
    - name: bpffs
      mountPath: /sys/fs/bpf
    - name: modules
      mountPath: /lib/modules
      readOnly: true
  - name: snap
    image: lmsysorg/sglang:v0.5.15.post1-cu129
    command:
    - /bin/sh
    - /watcher/snapshot.sh
    env:
    - name: HOST
      value: glm52-native
    - name: PORT
      value: '30000'
    - name: OUTDIR
      value: /out
    - name: TRIGGER_S
      value: '8'
    - name: COOLDOWN_S
      value: '60'
    - name: MAX_SNAPS
      value: '0'
    - name: ALLOW_GDB
      value: '0'
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: utility
    securityContext:
      privileged: true
    volumeMounts:
    - name: out
      mountPath: /out
    - name: watcher
      mountPath: /watcher
  volumes:
  - name: out
    emptyDir: {}
  - name: bpf
    configMap:
      name: ced2538-bpf
  - name: watcher
    configMap:
      name: ced2538-watcher
      defaultMode: 493
  - name: debugfs
    hostPath:
      path: /sys/kernel/debug
  - name: bpffs
    hostPath:
      path: /sys/fs/bpf
  - name: modules
    hostPath:
      path: /lib/modules
