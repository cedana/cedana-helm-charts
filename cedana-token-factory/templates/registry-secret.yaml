{{- if .Values.imageRegistry }}
{{- $user := (urlParse (required "Please provide --set url=<cedana-helm's config.url>; it is also the registry login" .Values.url)).host }}
{{- $key := required "Please provide --set agentToken=<cedana-helm's config.authToken>" .Values.agentToken }}
{{- $auth := dict "auths" (dict .Values.imageRegistry (dict "username" $user "password" $key "auth" (printf "%s:%s" $user $key | b64enc))) }}
apiVersion: v1
kind: Secret
metadata:
  name: tokenfactory-registry
  labels: {{- include "cedana-token-factory.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $auth | toJson | b64enc }}
{{- end }}
