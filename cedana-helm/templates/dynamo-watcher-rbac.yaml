{{- if .Values.dynamoWatcher.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cedana-helm.fullname" . }}-dynamo-watcher
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: cedana-helm
    app.kubernetes.io/part-of: cedana-helm
    {{- include "cedana-helm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cedana-helm.fullname" . }}-dynamo-watcher-role
  labels:
  {{- include "cedana-helm.labels" . | nindent 4 }}
rules:
# NVIDIA Dynamo CRDs: watch DGDs, manage worker-metadata, apply/remove DGDs from
# RabbitMQ create/delete workload messages.
- apiGroups:
  - "nvidia.com"
  resources:
  - dynamographdeployments
  - dynamoworkermetadatas
  # dynamocomponentdeployments: reaping superseded worker generations.
  #
  # The operator names each DCD "<dgd>-<component>-<specHash>" and creates a new
  # one whenever the pod spec changes, without removing the previous one. On a
  # single-GPU node that is a deadlock, not clutter: the superseded worker keeps
  # the device, so its replacement sits Pending for ever and the change never
  # takes effect. reapSupersededComponents exists to delete them and runs on
  # every DGD apply — but without list/delete here it fails on the first call
  # and logs at Debug, which is off in this deployment, so it appears to do
  # nothing at all.
  #
  # Presents as "the cluster is stuck": the profile reports READY False with a
  # Pending pod against it while the old worker serves happily, and the only way
  # out is deleting the stale DCD by hand. That was done eight times in one
  # evening before the missing verb was found.
  - dynamocomponentdeployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Pods: worker-metadata reconciler deletes stuck pods; RabbitMQ consumer creates pods.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - delete
# Nodes: the restore gate. A memory-tier checkpoint stops being restorable the
# moment its node reboots, so selectRestorableArtifact compares the artifact's
# recorded boot id against the live node's. Without `get` on nodes that lookup
# fails, and because "cannot verify" is treated as "cannot restore", every
# checkpoint is rejected and every activation cold starts — costing eleven
# minutes each time while reporting only that the checkpoint was "not usable".
#
# The failure is easy to misread as preemption: the artifact is present, the
# path is correct, the boot id in the record is right, and the node is healthy.
# Only the reason string names the permission.
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
# pods/exec: releasing a checkpoint's disk before writing a new one.
#
# The memory tier holds one checkpoint of a 27B model and not two — 50 GiB
# against ~42 GiB — so an on-demand checkpoint must delete the previous dump
# before it can write. The daemon cannot do it: DeleteCheckpoint takes an id
# from the daemon's job registry, and a container dumped directly is not in it
# ("cedana jobs" on a node holding a 42 GiB checkpoint reports none). The helper
# is the only pod on a GPU node with the host filesystem mounted, so the
# directory is removed through it.
#
# Note when checking this by hand: `kubectl auth can-i create pods/exec` reports
# yes off the plain pods rule above and is not a test of this one. Use
# `kubectl auth can-i create pods --subresource=exec`.
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
# Jobs: the model-cache staging Job that pulls weights into the inference
# namespace PVC before a profile can serve. Without this the controller cannot
# read or create it, every activation fails at "staging weights", and the model
# never comes up — with the failure reported as an intent that will not apply
# rather than as a missing permission.
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - delete
# Services: create/delete LoadBalancer services for dynamo frontends.
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# PersistentVolumeClaims: RabbitMQ consumer provisions PVCs for restored workloads.
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
# Deployments: inference controller scales CPU inference Deployments per propagator
# capacity intents (replicas 0/1) in the inference namespace.
- apiGroups:
  - "apps"
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - update
# Leases: inference controller leader election in the inference namespace.
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - leases
  verbs:
  - get
  - create
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cedana-helm.fullname" . }}-dynamo-watcher-rolebinding
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: cedana-helm
    app.kubernetes.io/part-of: cedana-helm
  {{- include "cedana-helm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "cedana-helm.fullname" . }}-dynamo-watcher-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "cedana-helm.fullname" . }}-dynamo-watcher'
  namespace: '{{ .Release.Namespace }}'
{{- end }}
