{{- if not .Values.config.preExistingConfigMap -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cedana-config
  labels:
    app: cedana-config
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
data:
  cluster-id: "{{ required "Please provide --set config.clusterId=<cluster-id>" .Values.config.clusterId }}"
  url: "{{ required "Please provide --set config.url=<cedana-url>" .Values.config.url }}"
  address: "{{ required "Please provide --set config.address=<daemon-address>" .Values.config.address }}"
  protocol: "{{ required "Please provide --set config.protocol=<daemon-protocol>" .Values.config.protocol }}"
  sqs-queue-url: "{{ .Values.config.sqsQueueUrl }}"
  checkpoint-dir: "{{ .Values.config.checkpointDir }}"
  checkpoint-streams: "{{ .Values.config.checkpointStreams }}"
  checkpoint-stream-memory-limit: "{{ .Values.config.checkpointStreamMemoryLimit }}"
  checkpoint-compression: "{{ .Values.config.checkpointCompression }}"
  checkpoint-async: "{{ .Values.config.checkpointAsync }}"
  gpu-pool-size: "{{ .Values.config.gpuPoolSize }}"
  gpu-shm-size: "{{ .Values.config.gpuShmSize }}"
  gpu-dedup-enabled: "{{ .Values.config.gpuDedupEnabled }}"
  plugins-builds: "{{ .Values.config.pluginsBuilds }}"
  plugins-criu-version: "{{ .Values.config.pluginsCriuVersion }}"
  plugins-containerd-runtime-version: "{{ .Values.config.pluginsContainerdRuntimeVersion }}"
  plugins-gpu-version: "{{ .Values.config.pluginsGpuVersion }}"
  plugins-streamer-version: "{{ .Values.config.pluginsStreamerVersion }}"
  metrics: "{{ .Values.config.metrics }}"
  profiling: "{{ .Values.config.profiling }}"
  log-level: "{{ .Values.config.logLevel }}"

  aws-access-key-id: "{{ .Values.config.awsAccessKeyId }}"
  aws-region: "{{ .Values.config.awsRegion }}"
  aws-endpoint: "{{ .Values.config.awsEndpoint }}"

  containerd-address: "{{ .Values.hostConfig.containerdAddress }}"
  disable-io-uring: "{{ .Values.hostConfig.disableIoUring }}"
  shm-config-enabled: "{{ .Values.hostConfig.shmConfig.enabled }}"
  shm-config-size: "{{ .Values.hostConfig.shmConfig.size }}"
  shm-config-min-size: "{{ .Values.hostConfig.shmConfig.minSize }}"

  csx-log-level: "{{ .Values.csxConfig.logLevel }}"
  csx-sock-addr: "{{ .Values.csxConfig.sockAddr }}"
  csx-memory-cache-percent: "{{ .Values.csxConfig.memoryCachePercent }}"
  csx-memory-cache-path: "{{ .Values.csxConfig.memoryCachePath }}"
  csx-local-disk-cache-limit: "{{ .Values.csxConfig.localDiskCacheLimit }}"
  csx-local-disk-cache-path: "{{ .Values.csxConfig.localDiskCachePath }}"
  {{- if eq .Values.config.checkpointDir "csx://" }}
  csx-nfs-path: "{{ required "Please provide --set csxConfig.nfsPath=<nfs-path> when config.checkpointDir=csx://" .Values.csxConfig.nfsPath }}"
  {{- else }}
  csx-nfs-path: "{{ .Values.csxConfig.nfsPath }}"
  {{- end }}
  csx-nfs-poll-interval: "{{ .Values.csxConfig.nfsPollInterval }}"
  csx-tmp-dir: "{{ .Values.csxConfig.tmpDir }}"
  csx-tmp-dir-object-limit: "{{ .Values.csxConfig.tmpDirObjectLimit }}"
  csx-enable-metrics: "{{ .Values.csxConfig.enableMetrics }}"
  csx-read-timeout: "{{ .Values.csxConfig.readTimeout }}"
  csx-write-timeout: "{{ .Values.csxConfig.writeTimeout }}"

  criu-log-level: "{{ .Values.config.criuLogLevel }}"
{{- end }}
