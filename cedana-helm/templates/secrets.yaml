{{- if not .Values.config.preExistingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "cedana-helm.secretName" . }}
  labels:
    app: {{ template "cedana-helm.secretName" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
type: Opaque
data:
  auth-token: "{{ required "Please provide --set config.authToken=<cedana-auth-token>" .Values.config.authToken | b64enc }}"
  {{- if .Values.config.awsSecretAccessKey }}
  aws-secret-access-key: "{{ .Values.config.awsSecretAccessKey | b64enc }}"
  {{- else }}
  aws-secret-access-key: ""
  {{- end }}
  {{- /*
    The access key id lives here rather than in the ConfigMap. On its own it
    identifies rather than authenticates, which is why it was treated as
    configuration — but it is half of a credential pair, and a ConfigMap is
    readable by anything that can read ConfigMaps and is printed in full by
    routine debugging. Keeping the pair together means one thing to rotate and
    one thing to guard.
  */}}
  {{- if .Values.config.awsAccessKeyId }}
  aws-access-key-id: "{{ .Values.config.awsAccessKeyId | b64enc }}"
  {{- else }}
  aws-access-key-id: ""
  {{- end }}
{{- end }}
