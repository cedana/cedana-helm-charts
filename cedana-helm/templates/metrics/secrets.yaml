{{- if .Values.clusterMetrics.enabled -}}
{{- if include "cedana-helm.vectorEnabled" . -}}
{{- $mode := include "cedana-helm.metricsStorageMode" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: vector-aws-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- if eq $mode "static" }}
  AWS_ACCESS_KEY_ID: {{ dig "s3" "awsAccessKeyId" "" (.Values.clusterMetrics | default dict) | default .Values.config.awsAccessKeyId | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ dig "s3" "awsSecretAccessKey" "" (.Values.clusterMetrics | default dict) | default .Values.config.awsSecretAccessKey | default "" | quote }}
{{- else }}
  # The AWS SDK's container credential provider; served by the metrics-credentials sidecar.
  AWS_CONTAINER_CREDENTIALS_FULL_URI: "http://127.0.0.1:9099/credentials.json"
{{- end }}
{{- end -}}
{{- end -}}
