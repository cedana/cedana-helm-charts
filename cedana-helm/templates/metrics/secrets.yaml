{{- if .Values.clusterMetrics.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: vector-aws-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  awsAccessKeyId: {{ dig "clusterMetrics" "s3" "awsAccessKeyId" "" .Values | default .Values.config.awsAccessKeyId | default "" | quote }}
  awsSecretAccessKey: {{ dig "clusterMetrics" "s3" "awsSecretAccessKey" "" .Values | default .Values.config.awsSecretAccessKey | default "" | quote }}
{{- end -}}
