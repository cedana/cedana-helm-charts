{{- if .Values.clusterMetrics.enabled -}}
{{- $token := .Values.config.authToken -}}
{{- if and (not $token) .Values.config.preExistingSecret -}}
{{- /* Vector's env is fixed in subchart values, so the token is copied from the existing Secret. */ -}}
{{- with lookup "v1" "Secret" .Release.Namespace .Values.config.preExistingSecret -}}
{{- $token = index .data "auth-token" | default "" | b64dec -}}
{{- end -}}
{{- /* lookup is empty without a cluster (helm template, GitOps); fail rather than ship an empty token. */ -}}
{{- if not $token -}}
{{- fail (printf "clusterMetrics needs the auth token: set config.authToken, or install with helm against a cluster holding Secret %s" .Values.config.preExistingSecret) -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: vector-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  cedanaAuthToken: {{ $token | default "" | quote }}
{{- end -}}
