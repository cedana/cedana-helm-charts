{{- if .Values.clusterMetrics.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: vector-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- $token := .Values.config.authToken }}
  {{- /* With config.preExistingSecret, copy its token; lookup is empty under helm template. */}}
  {{- if and (not $token) .Values.config.preExistingSecret }}
  {{- with lookup "v1" "Secret" .Release.Namespace .Values.config.preExistingSecret }}
  {{- $token = index .data "auth-token" | default "" | b64dec }}
  {{- end }}
  {{- end }}
  cedanaAuthToken: {{ $token | default "" | quote }}
{{- end -}}
