{{- if .Values.clusterMetrics.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: vector-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  cedanaAuthToken: {{ .Values.config.authToken | default "" | quote }}
  awsAccessKeyId: {{ .Values.clusterMetrics.s3.awsAccessKeyId | default .Values.config.awsAccessKeyId | default "" | quote }}
  awsSecretAccessKey: {{ .Values.clusterMetrics.s3.awsSecretAccessKey | default .Values.config.awsSecretAccessKey | default "" | quote }}
{{- end -}}
