{{- if .Values.clusterMetrics.enabled -}}
{{- $url := required "config.url is required" .Values.config.url | trimSuffix "/" | trimSuffix "/v1" | trimSuffix "/v2" -}}
{{- $bucket := .Values.clusterMetrics.s3.bucket -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: {{ .Release.Namespace }}
data:
  vector.yaml: |
    data_dir: /vector-data
    sources:
      host_metrics:
        type: host_metrics
        scrape_interval_secs: 60
      # Series Prometheus keeps (see prometheus.server.remoteWrite), tagged with their collector.
      prometheus:
        type: prometheus_remote_write
        address: 0.0.0.0:9090
    transforms:
      node_host:
        type: remap
        inputs: [host_metrics]
        source: |
          .tags.host = get_env_var!("SPEC_NODE_NAME")
      tagged:
        type: remap
        inputs: [node_host, prometheus]
        source: |
          .tags.cluster_id = {{ .Values.config.clusterId | default "" | quote }}
          .tags.ts = to_string(to_unix_timestamp(now()))
    sinks:
      {{- if $bucket }}
      s3:
        type: aws_s3
        inputs: [tagged]
        bucket: {{ $bucket | quote }}
        region: {{ .Values.clusterMetrics.s3.region | default .Values.config.awsRegion | default "us-east-1" | quote }}
        compression: none
        encoding:
          codec: json
        batch:
          max_bytes: 10485760
          timeout_secs: 15
        # ClickHouse's S3Queue reads <host>/v2/vector/data/**/*.log.
        key_prefix: "{{ $url | trimPrefix "https://" | trimPrefix "http://" }}/v2/vector/data/{{ "{{" }} tags.ts {{ "}}" }}/"
        filename_time_format: "%s"
        filename_append_uuid: true
      {{- else }}
      # Same newline-delimited JSON as the S3 objects; Cedana stores it in its own bucket.
      cedana:
        type: http
        inputs: [tagged]
        uri: {{ printf "%s/v1/metrics/ingest" $url | quote }}
        method: post
        encoding:
          codec: json
        framing:
          method: newline_delimited
        auth:
          strategy: bearer
          token: "${CEDANA_AUTH_TOKEN}"
        batch:
          max_bytes: 10485760
          timeout_secs: 15
      {{- end }}
{{- end -}}
