{{- if .Values.clusterMetrics.enabled -}}
{{- if include "cedana-helm.vectorEnabled" . -}}
{{- $mode := include "cedana-helm.metricsStorageMode" . -}}
{{- $refresh := dig "storage" "credentialsRefreshSecs" 1800 (.Values.clusterMetrics | default dict) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-bootstrap
  namespace: {{ .Release.Namespace }}
data:
  mode: {{ $mode | quote }}
  refresh-secs: {{ $refresh | quote }}
{{- if eq $mode "static" }}
{{- $cedanaUrl := required "config.url is required!" .Values.config.url }}
{{- $host := $cedanaUrl | trimSuffix "/v1" | trimSuffix "/v2" | trimSuffix "/" | trimPrefix "https://" | trimPrefix "http://" }}
{{- $region := .Values.clusterMetrics.s3.region | default .Values.config.awsRegion | default "us-east-1" }}
{{- $bucket := required "clusterMetrics.s3.bucket is required when clusterMetrics.storage.mode is static!" .Values.clusterMetrics.s3.bucket }}
  sink.static.yaml: |
    sinks:
      s3_sink:
        type: aws_s3
        inputs: [add_timestamp]
        bucket: {{ $bucket | quote }}
        region: {{ $region | quote }}
        compression: "none"
        encoding:
          codec: "json"
        batch:
          max_bytes: 10485760 # 10MB
          timeout_secs: 15
        key_prefix: "{{ $host }}/v2/vector/data/{{ "{{" }} tags.ts {{ "}}" }}/"
        filename_time_format: "%s-{{ .Values.config.clusterId | replace "-" "" }}"
        filename_append_uuid: true
{{- end }}
  bootstrap.sh: |
    #!/bin/sh
    # Writes /etc/vector-dynamic/sink.yaml: the control plane's fragment, or the static one.
    set -eu
    OUT=/etc/vector-dynamic/sink.yaml
    if [ "$(cat /opt/cedana/mode)" = "static" ]; then
      cp /opt/cedana/sink.static.yaml "$OUT"
      exit 0
    fi
    URL="${CEDANA_URL%/}/cluster/${CEDANA_CLUSTER_ID}/metrics/storage?format=vector"
    until wget -q -O "$OUT.tmp" --header "Authorization: Bearer ${CEDANA_AUTH_TOKEN}" "$URL"; do
      echo "metrics storage not yet available from ${URL%%\?*}; retrying in 15s"
      sleep 15
    done
    mv "$OUT.tmp" "$OUT"
    echo "wrote $OUT from the control plane"
  credentials.sh: |
    #!/bin/sh
    # Serves the AWS container-credentials document for the vector container on 127.0.0.1:9099
    # and refreshes it from the control plane. The previous document stays served on a failed
    # refresh; Vector's disk buffer holds data while credentials are unusable.
    set -u
    if [ "$(cat /opt/cedana/mode)" = "static" ]; then
      while :; do sleep 3600; done
    fi
    DIR=/var/lib/vector-credentials
    URL="${CEDANA_URL%/}/cluster/${CEDANA_CLUSTER_ID}/metrics/credentials"
    REFRESH=$(cat /opt/cedana/refresh-secs)
    fetch() {
      wget -q -O "$DIR/credentials.json.tmp" --header "Authorization: Bearer ${CEDANA_AUTH_TOKEN}" "$URL" \
        && mv "$DIR/credentials.json.tmp" "$DIR/credentials.json"
    }
    until fetch; do
      echo "credentials not yet available from $URL; retrying in 15s"
      sleep 15
    done
    httpd -p 127.0.0.1:9099 -h "$DIR"
    echo "serving credentials on 127.0.0.1:9099, refreshing every ${REFRESH}s"
    while sleep "$REFRESH"; do
      fetch || echo "credential refresh failed; serving the previous document until it expires"
    done
{{- end -}}
{{- end -}}
