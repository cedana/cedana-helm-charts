{{- if .Values.switchyard.enabled }}
{{- if and .Values.switchyard.telemetryExistingClaim (ne (int .Values.switchyard.replicaCount) 1) }}
{{- fail "switchyard.telemetryExistingClaim requires replicaCount=1; each writer needs its own outbox volume" }}
{{- end }}
{{- $ns := .Values.switchyard.namespace }}
# Switchyard: the inference gateway agents talk to. Lives in the inference namespace next
# to the Dynamo deployments it routes to, and uses the release's auth token against the
# same propagator the controller reports to.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/component: switchyard
    {{- include "cedana-helm.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: switchyard-config
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: switchyard
    {{- include "cedana-helm.labels" . | nindent 4 }}
data:
  config.toml: |
    schema_version = 1

    [cedana]
    propagator_url = {{ .Values.config.url | quote }}
{{- with .Values.switchyard.extraConfig }}
{{ . | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: switchyard-token
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: switchyard
    {{- include "cedana-helm.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ required "Please provide --set config.authToken=<cedana-auth-token>" .Values.config.authToken | b64enc | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchyard
  namespace: {{ $ns }}
  labels:
    app: switchyard
    app.kubernetes.io/component: switchyard
    {{- include "cedana-helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.switchyard.replicaCount | default 1 }}
  {{- if .Values.switchyard.telemetryExistingClaim }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: switchyard
  template:
    metadata:
      labels:
        app: switchyard
        app.kubernetes.io/component: switchyard
      {{- with .Values.switchyard.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.switchyard.telemetryExistingClaim }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      containers:
        - name: switchyard
          {{- if .Values.switchyard.image.digest }}
          image: {{ .Values.switchyard.image.repository }}@{{ .Values.switchyard.image.digest }}
          {{- else }}
          image: {{ .Values.switchyard.image.repository }}:{{ .Values.switchyard.image.tag }}
          {{- end }}
          imagePullPolicy: {{ .Values.switchyard.image.imagePullPolicy }}
          args: ["--config", "/etc/switchyard/config.toml"]
          ports:
            - name: http
              containerPort: 4000
          env:
            {{- if .Values.switchyard.telemetryExistingClaim }}
            - name: CEDANA_TELEMETRY_DIR
              value: /var/lib/switchyard/telemetry
            {{- end }}
            - name: CEDANA_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: switchyard-token
                  key: token
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.switchyard.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.switchyard.telemetryExistingClaim }}
            - name: telemetry
              mountPath: /var/lib/switchyard/telemetry
            {{- end }}
            - name: config
              mountPath: /etc/switchyard
      volumes:
        {{- if .Values.switchyard.telemetryExistingClaim }}
        - name: telemetry
          persistentVolumeClaim:
            claimName: {{ .Values.switchyard.telemetryExistingClaim | quote }}
        {{- end }}
        - name: config
          configMap:
            name: switchyard-config
      {{- with .Values.switchyard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.switchyard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: switchyard
  namespace: {{ $ns }}
  labels:
    app: switchyard
    app.kubernetes.io/component: switchyard
    {{- include "cedana-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.switchyard.service.type }}
  selector:
    app: switchyard
  ports:
    - name: http
      port: {{ .Values.switchyard.service.port }}
      targetPort: http
{{- end }}
