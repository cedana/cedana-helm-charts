{{- if eq .Values.config.checkpointDir "csx://" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cedana-helm.fullname" . }}-csx
  labels:
    app.kubernetes.io/component: csx
    app.kubernetes.io/created-by: cedana-helm
    app.kubernetes.io/part-of: cedana-helm
    {{- include "cedana-helm.labels" . | nindent 4 }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.csx.updateStrategy.maxSurge }}
      maxUnavailable: {{ .Values.csx.updateStrategy.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: csx
      {{- include "cedana-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: csx
        {{- include "cedana-helm.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/csx-config: {{ include (print $.Template.BasePath "/csx-configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      hostPID: true
      hostIPC: true
      hostNetwork: true
      {{- with .Values.csx.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csx.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csx.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csx
          {{- if .Values.csx.image.digest }}
          image: {{ .Values.csx.image.repository }}@{{ .Values.csx.image.digest }}
          {{- else }}
          image: {{ .Values.csx.image.repository }}:{{ .Values.csx.image.tag }}
          {{- end }}
          imagePullPolicy: {{ .Values.csx.image.imagePullPolicy }}
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: host-volume
              mountPath: /host
              readOnly: false
          command: ["/bin/bash"]
          args: ["scripts/install-k8s.sh"]
          env:
            - name: CEDANA_CSX_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-log-level
            - name: CEDANA_CSX_SOCK_ADDR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-sock-addr
            - name: CEDANA_CSX_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-mode
            - name: CEDANA_CSX_NFS_STORE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-nfs-store-path
            - name: CEDANA_CSX_NFS_STORE_MEMORY_CACHE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-nfs-store-memory-cache-path
            - name: CEDANA_CSX_NFS_STORE_MEMORY_CACHE_PERCENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-nfs-store-memory-cache-percent
            - name: CEDANA_CSX_NFS_STORE_LOCAL_DISK_CACHE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-nfs-store-local-disk-cache-path
            - name: CEDANA_CSX_NFS_STORE_LOCAL_DISK_CACHE_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-nfs-store-local-disk-cache-limit
            - name: CEDANA_CSX_P2P_STORE_DISK_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-p2p-store-disk-path
            - name: CEDANA_CSX_P2P_STORE_TMP_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-p2p-store-tmp-path
            - name: CEDANA_CSX_P2P_STORE_LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-p2p-store-listen-addr
            - name: CEDANA_CSX_P2P_STORE_STREAMS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-p2p-store-streams
            # The address peers pull checkpoints from. The pod runs on the host
            # network, so the node IP plus the p2p port reaches CSX's listener.
            - name: CSX_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CEDANA_CSX_P2P_STORE_PEER_ADDR
              value: "$(CSX_HOST_IP):{{ .Values.csx.p2p.port }}"
            - name: CEDANA_CSX_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-poll-interval
            - name: CEDANA_CSX_TMP_DIR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-tmp-dir
            - name: CEDANA_CSX_TMP_DIR_OBJECT_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-tmp-dir-object-limit
            - name: CEDANA_CSX_ENABLE_METRICS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-enable-metrics
            - name: CEDANA_CSX_READ_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-read-timeout
            - name: CEDANA_CSX_WRITE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-write-timeout
            - name: CEDANA_CSX_PROPAGATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ template "cedana-helm.configMapName" . }}
                  key: url
            - name: CEDANA_CSX_PROPAGATOR_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ template "cedana-helm.secretName" . }}
                  key: auth-token
            - name: CEDANA_CSX_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ template "cedana-helm.configMapName" . }}
                  key: cluster-id
            - name: CEDANA_CSX_INITIALIZATION_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cedana-helm.csxConfigMapName" . }}
                  key: csx-initialization-timeout
            - name: CEDANA_CSX_ENABLE_RMQ
              value: "true"
      volumes:
        - name: host-volume
          hostPath:
            path: /
{{- end }}
