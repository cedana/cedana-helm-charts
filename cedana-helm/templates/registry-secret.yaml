{{- if .Values.imageRegistry }}
{{- $user := (urlParse (required "Please provide --set config.url=<cedana-url>; it is also the registry login" .Values.config.url)).host }}
{{- $key := .Values.config.authToken }}
{{- if and (not $key) .Values.config.preExistingSecret }}
{{- with lookup "v1" "Secret" .Release.Namespace .Values.config.preExistingSecret }}
{{- $key = index .data "auth-token" | default "" | b64dec }}
{{- end }}
{{- end }}
{{- /* lookup is empty without a cluster (helm template, GitOps); fail rather than ship an empty key. */}}
{{- if not $key }}
{{- fail (printf "pulling images needs the auth token: set config.authToken, or install with helm against a cluster holding Secret %s" (default "config.preExistingSecret" .Values.config.preExistingSecret)) }}
{{- end }}
{{- $auth := dict "auths" (dict .Values.imageRegistry (dict "username" $user "password" $key "auth" (printf "%s:%s" $user $key | b64enc))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cedana-helm.registrySecretName" . }}
  labels:
    {{- include "cedana-helm.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $auth | toJson | b64enc }}
{{- end }}
