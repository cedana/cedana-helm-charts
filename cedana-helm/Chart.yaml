apiVersion: v2
name: cedana-helm
description: Helm chart for Cedana k8s system
type: application
version: 0.7.7
# The appVersion is the version of the Cedana API this chart
# should best work with.
appVersion: 2.0.2.9

dependencies:
  - name: prometheus
    version: "25.21.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: clusterMetrics.prometheus.enabled
  - name: vector
    version: "0.34.0"
    repository: "https://helm.vector.dev"
    condition: clusterMetrics.vector.enabled
  - name: dcgm-exporter
    version: "3.4.0"
    repository: "https://nvidia.github.io/dcgm-exporter/helm-charts"
    condition: clusterMetrics.gpu.enabled
