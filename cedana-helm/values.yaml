nameOverride: cedana
fullnameOverride: cedana

config:
  authToken:
  url:
  clusterId:
  sqsQueueUrl:

  # Specify the address to bind the daemon on (socket path for unix, host:port for tcp)
  #
  # For unix, the socket's directory is shared with the helper pods via hostPath,
  # so keep it in a dedicated directory.
  #
  # Default: /run/cedana/cedana.sock
  address: /run/cedana/cedana.sock
  # Specify the protocol to use for daemon service
  # Default: unix (uses no host port)
  # Options:
  # - unix: Unix Socket
  # - tcp: TCP socket (binds a port on the host network)
  # - vsock: VSock for VM and hypervisor communication, useful for supporting VM based migrations
  protocol: unix

  # Specify path to directory for storing checkpoints.
  # - `cedana://<path>` for Cedana-managed global storage
  # - `s3://<bucket>/<path>` for your S3 storage
  # - `<path>` for node-local storage (not recommended, as it won't be accessible across nodes)
  # - `csx://` for using Cedana's custom NFS backed storage solution (recommended)
  #   CSX uses a combination of tmpfs, local disk and NFS to store and cache checkpoints.
  #   All checkpoints are persisted to NFS but are written first to RAM in order to reduce freeze time.
  #   Checkpoints are automatically cached to tmpfs and local disk allowing for faster restores.
  #   CSX is not compatible with checkpoint streaming, so checkpointStreams MUST BE 0 for CSX to work
  #   correctly.
  #   See the `csx` key to configure NFS path, tmpfs limits, local disk limits and other config options.
  checkpointDir: "/tmp"
  # Specify the number of parallel streams to use for streaming checkpoint/restore operations.
  # 0 means no streaming. n > 0 means n parallel streams (or number of pipes) to use.
  # Streaming ensures a low footprint by using memory efficiently with no intermediate
  # disk space required, although performance may be slightly better or worse depending on disk and network read/write speeds.
  checkpointStreams: 0
  # Specify the maximum memory (RAM) allowed for checkpoint streaming.
  checkpointStreamMemoryLimit: 4096 # 4 GiB
  checkpointCompression: none # Options: "none", "tar", "lz4", "gzip", "zlib"
  # Specify whether to perform checkpoint compression/upload async. Recommended if anticipating large checkpoints,
  # which could take too long to stream directly to a bucket. Note that restore will only be possible after upload is complete,
  # so there might be a delay before a workload can be restored even though the checkpoint shows as complete.
  checkpointAsync: false

  gpuPoolSize: 0 # Number of GPU controllers to keep warm. Improves GPU workload startup/restore time but uses more memory.
  gpuShmSize: "8589934592" # 8 GiB. Enough for most workloads. Reduce if memory constrained or running small workloads only.
  gpuRestoreNic: "auto" # How restored UCX contexts pick their RDMA NIC. Options: "auto" (closest to the GPU), "mapping" (VLLM_GPU_NIC_PCIE_MAPPING), "off" (as checkpointed).
  gpuDedupEnabled: false # Enable deduplication for GPU checkpoints to reduce checkpoint size.
  gpuTemplatesEnabled: false # Enable templates for GPU checkpoint/restore.
  gpuDeltaEnabled: false # Only save GPU memory changed since the previous checkpoint.
  gpuVerify: "off" # Check restored GPU state against the checkpoint. Options: "off", "warn" (log mismatches), "strict" (fail the restore).
  gpuProfilingEnabled: false # Enable CUDA call profiling.
  gpuComputeSanitizer: false # Run restored GPU workers under compute-sanitizer (debug).
  gpuDirectIO: true # Read and write GPU checkpoints with O_DIRECT. Bypasses page cache for faster checkpoint/restore.
  gpuMemRingBufSize: 8 # Number of staging buffers for GPU memory restore with O_DIRECT. Minimum 2.

  # Specify the plugin versions to use. If pluginsBuilds is "release", then any release version
  # for the plugins can be specified. If pluginsBuilds is "alpha", then specify the branch name.
  pluginsBuilds: alpha
  pluginsCriuVersion: criu-dev              # last release v4.3-cedana.00
  pluginsCriuNvidiaDev: true
  pluginsCriuInfiniband: true
  pluginsContainerdRuntimeVersion: cedana   # last release v0.8.8
  pluginsGpuVersion: main                   # last release v0.8.11
  pluginsStreamerVersion: main              # last release v0.1.5

  profiling: true
  metrics: true
  logLevel: info

  awsAccessKeyId: # AWS access key ID if using S3 storage (if `s3://<bucket>/<path>` in checkpointDir)
  awsSecretAccessKey: # AWS secret access key if using S3 storage
  # AWS credential provider: static, eksPodIdentity, or ambient
  awsCredentialsMode: static
  awsRegion: # AWS region if using S3 storage (uses default region if not set)
  awsEndpoint: # AWS endpoint if using S3-compatible storage

  criuLogLevel: 2
  # Omit all-zero shared memory and ghost file pages from dumps (restored as zero-fill). Needs a CRIU with --zero-elide.
  criuZeroElide: true
  # Threads that scan and write shared memory segments on dump
  criuShmemDumpThreads: 1

  # Fall back to a normal (cold) start of the container if a Cedana restore fails, instead of failing the pod.
  fallbackColdStart: true

  # Install the host packages Cedana needs (CRIU's libraries, iptables, pidof, ...) when they are
  # missing (installed packages are never upgraded). Set to false for no package changes on the node: the
  # helper's setup then only logs what is missing with the commands that install it, and
  # `cedana k8s deps-script` prints the full script, e.g. to run in the node image.
  installDeps: true

  # Uncomment, to use custom pre-existing secret
  # preExistingSecret: cedana-secret-user

hostConfig:
  containerdAddress: /run/containerd/containerd.sock # Path to containerd socket
  # Cedana does not support io-uring based checkpoint restores
  # Set ioUring to false to disable linux kernel's io-uring option
  disableIoUring: true
  # Optional configuration to increase /dev/shm size on nodes
  # This is useful for workloads that require large shared memory
  shmConfig:
    enabled: false # Set to true to enable /dev/shm size increase
    size: 10G # Size to set for /dev/shm (e.g., "10G", "20G")
    minSize: 10G # Minimum size to trigger remount (e.g., "10G", "20G")

daemonHelper:
  serviceAccount:
    # Create a dedicated ServiceAccount for the S3-using helper DaemonSets.
    create: true
    name: cedana-helper
    automount: false
    annotations: {}
  image:
    repository: cedana/cedana-helper-test
    tag: main   # last release v0.9.411
    digest: # ignores tag if set
    imagePullPolicy: IfNotPresent
  updateStrategy:
    maxSurge: 0
    maxUnavailable: 99999
  tolerations: []
  affinity: {}
  # Restrict Cedana to labeled nodes; the controller marks only these nodes ready.
  #   kubectl label nodes <node-name> cedana.ai/enabled=true
  #   nodeSelector: { cedana.ai/enabled: "true" }
  # Empty = all nodes (default).
  nodeSelector: {}
  # Setup (host checks, plugin downloads, containerd and kubelet restarts) runs before the daemon
  # answers the startup probe: on a fresh node it can take minutes
  startupTimeoutSeconds: 600
  # Sets ENV on the helper. Any value other than "production" skips its containerd and kubelet
  # setup; leave empty unless the node's runtime is configured by other means.
  setupEnv: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: cedana-controller-manager

controllerManager:
  # Whether the controller labels a node cedana.ai/ready=true once Cedana is ready on it. The
  # cedana RuntimeClass selects on that label, so only pods using it wait for a ready node. Set
  # false to manage node readiness yourself; the RuntimeClass then has no node selector.
  taintNodes: true
  # Disaggregated prefill/decode worker restores and scaling: the controller sets up pods
  # annotated cedana.ai/pd-disagg (Dynamo snapshot mode, Cedana's vLLM/SGLang patch, the Cedana
  # env). When enabled, the controller creates the webhook's Service, self-signed cert and
  # MutatingWebhookConfiguration itself; turning it off removes them on the controller's next start.
  pdDisaggWebhook:
    enabled: false
  autoscaling:
    enabled: false
    replicaCount: 1
    deploymentRevisionHistoryLimit: 10
  service:
    annotations: {}
    ports:
      - protocol: TCP
        port: 1324
        targetPort: 1324
  manager:
    podAnnotations: {}
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    containerSecurityContext:
      # controller doesn't require any privileges
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      repository: cedana/cedana-controller-test
      tag: main   # last release v0.7.7
      digest: # ignores tag if set
      imagePullPolicy: Always  # floating tag: IfNotPresent keeps a stale build
    resources:
      # empty to ensure minimal resource
      # usage on demo/test deployments
      # uncomment or add custom resource
      # limits:
      #   cpu: 500m
      #   memory: 128Mi
      # requests:
      #   cpu: 10m
      #   memory: 64Mi
  rbac:
    resources:
      # empty to ensure minimal resource
      # usage on demo/test deployments
      # uncomment or add custom resource
      # limits:
      #   cpu: 500m
      #   memory: 128Mi
      # requests:
      #   cpu: 10m
      #   memory: 64Mi
  tolerations: []
    # Run the command below to deploy the controller on a dedicated node
    # This will not allow shceduling of new pods on the node running the controller pod
    # kubectl taint node <node-name> dedicated=cedana-manager:NoSchedule
    # - key: "dedicated"
    #   operator: "Equal"
    #   value: "cedana-manager"
    #   effect: "NoSchedule"
  affinity:
    # Allow scheduling of controller pod on the labeled node only
    # kubectl label nodes <node-name> dedicated=cedana-manager
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: "dedicated"
    #             operator: "In"
    #             values:
    #               - "cedana-manager"
  nodeSelector: {}

# dynamo-watcher: standalone component that watches DynamoGraphDeployments and
# dynamo Services, syncs their status to the Cedana propagator, and consumes the
# cluster's RabbitMQ create/delete workload queues. Only relevant on clusters that
# have NVIDIA Dynamo installed, so it is opt-in (disabled by default).
dynamoWatcher:
  enabled: false
  # Create a LoadBalancer Service for dynamo frontends (sets CEDANA_DYNAMO_CREATE_LB).
  createLoadBalancer: false
  # Watcher loops to run (sets CEDANA_DYNAMO_LOOPS), as a comma-separated list of
  # informers, worker-metadata, create-workload and delete-workload. Empty runs them
  # all; inference needs create-workload, which applies the models the control plane
  # sends. "worker-metadata" alone only re-registers restored workers with Dynamo
  # discovery, and gets a matching minimal ClusterRole.
  loops: "worker-metadata"
  replicaCount: 1
  podAnnotations: {}
  image:
    repository: cedana/cedana-dynamo-watcher-test
    # Keep in lockstep with controllerManager.manager.image.tag (same repo release).
    tag: main   # last release v0.7.7
    digest: # ignores tag if set
    imagePullPolicy: Always  # floating tag: IfNotPresent keeps a stale build
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Switchyard: the OpenAI-compatible inference gateway in front of the models the control
# plane deploys. Uses config.authToken and config.url.
switchyard:
  enabled: false
  # Also the namespace the models are deployed into.
  namespace: cedana-inference
  replicaCount: 1
  podAnnotations: {}
  image:
    repository: cedana/cedana-switchyard-test
    tag: main   # last release v0.3.0
    digest: # ignores tag if set
    imagePullPolicy: IfNotPresent
  # Appended verbatim to config.toml after the [cedana] table.
  extraConfig: ""
  service:
    type: ClusterIP
    port: 4000
    nodePort: # only used when type is NodePort
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []

# Subchart: NVIDIA Dynamo platform (operator; it applies the nvidia.com CRDs itself at start).
# 1.6.x discovers workers through the Kubernetes API and uses TCP/ZMQ planes, so neither NATS
# nor etcd is installed.
dynamo:
  enabled: false
  global:
    grove:
      # Runs every DGD as a Grove PodCliqueSet unless annotated nvidia.com/enable-grove=false.
      install: false

# With dynamo enabled, pulls these onto GPU nodes at install so a first deploy skips the pull.
# Nodes are those with nvidia.com/gpu.product (GPU feature discovery) unless nodeSelector is set.
enginePrepull:
  images:
    - nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.2
  nodeSelector: {}
  # Only the standard GPU taint: tolerating everything parks pods Pending on dead or tainted nodes.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# Subchart: NVIDIA device plugin, for clusters without one (e.g. plain k3s).
nvidiaDevicePlugin:
  enabled: false
  runtimeClassName: nvidia
  gfd:
    enabled: false

csx:
  image:
    repository: cedana/cedana-csx-test
    tag: main   # last release v0.2.3
    digest: # ignores tag if set
    imagePullPolicy: IfNotPresent
  updateStrategy:
    maxSurge: 0
    maxUnavailable: 99999
  tolerations: []
  affinity: {}
  # Restrict CSX to labeled nodes; the controller marks only these nodes ready.
  #   kubectl label nodes <node-name> cedana.ai/enabled=true
  #   nodeSelector: { cedana.ai/enabled: "true" }
  # Empty = all nodes (default).
  nodeSelector: {}
  logLevel: info
  # Path to Dir inside a NFS where CSX can store persistent checkpoints on the cluster.
  nfsPath:
  # Percentage of system RAM CSX can use to cache checkpoints (1-100).
  # CSX creates a tmpfs of this size at memoryCachePath.
  memoryCachePercent: 25
  # Path where CSX mounts the tmpfs used to cache checkpoints in RAM.
  # CSX creates the path if it does not exist.
  memoryCachePath: /cedana/memstore/
  # Amount of local disk space, in GiB, CSX can use to cache checkpoints.
  localDiskCacheLimit: 1000
  # Path on the local disk where CSX caches checkpoints.
  # CSX creates the path if it does not exist.
  localDiskCachePath: /cedana/diskstore/
  # Path of the Unix socket used by the CSX gRPC server.
  sockAddr: /run/csx.sock
  # Interval, in seconds, at which CSX checks NFS for checkpoints from other nodes.
  nfsPollInterval: 1
  # Path where CSX temporarily stores objects while they are being written or
  # have not yet been copied to NFS. CSX creates a tmpfs at this path.
  tmpDir: /cedana/tmpdir
  # Maximum number of objects allowed in tmpDir at once. Once reached, new
  # checkpoints are written straight to NFS.
  tmpDirObjectLimit: 1
  enableMetrics: false
  # Maximum duration, in seconds, that a read can remain open.
  readTimeout: 3600
  # Maximum duration, in seconds, that a write can remain open.
  writeTimeout: 3600
  # Maximum duration, in milliseconds, that CSX waits for an initial checkpoint
  # list before caching random checkpoints from NFS.
  initializationTimeout: 10000

kubernetesClusterDomain: cluster.local

metricsService:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: https
  type: ClusterIP

# Inference monitoring (on in values-inference-box.yaml). Prometheus scrapes cAdvisor,
# kube-state-metrics, the DCGM exporter (GPU nodes only) and the inference pods, and remote-writes
# the series Cedana keeps to Vector, which adds node host metrics and ships them to config.url.
clusterMetrics:
  enabled: false

# Subchart: Prometheus, a short-retention relay; Cedana stores the series.
prometheus:
  fullnameOverride: prometheus
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  # Vector's host_metrics covers node CPU, memory and filesystems.
  prometheus-node-exporter:
    enabled: false
  kube-state-metrics:
    collectors: [pods]
  server:
    retention: 2h
    persistentVolume:
      enabled: false
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    remoteWrite:
      # Vector's prometheus_remote_write source, in this namespace.
      - url: http://vector:9090
        write_relabel_configs:
          - source_labels: [__name__]
            regex: kube_pod_info|container_(cpu_usage_seconds_total|cpu_user_seconds_total|cpu_system_seconds_total|memory_usage_bytes|memory_working_set_bytes|memory_rss|memory_cache)|DCGM_FI_DEV_(GPU_UTIL|MEM_COPY_UTIL|FB_FREE|FB_USED|GPU_TEMP|POWER_USAGE)|cedana:.+
            action: keep
          - source_labels: [__name__]
            regex: cedana:.+
            target_label: collector
            replacement: inference
  serverFiles:
    # Per-model inference series, one per profile_id (inference.cedana.ai/profile-id); fleet totals carry none.
    recording_rules.yml:
      groups:
        - name: cedana-inference
          rules:
            # Serving series come from the Dynamo frontend: SGLang's own metrics need
            # --enable-metrics, which crashes a restored worker (its CPU clock restarts).
            - record: cedana:inference_generation_tokens_per_second
              expr: sum by (profile_id) (rate(dynamo_frontend_output_tokens_total[2m]))
            - record: cedana:inference_prompt_tokens_per_second
              expr: sum by (profile_id) (rate(dynamo_frontend_input_sequence_tokens_sum[2m]))
            - record: cedana:inference_requests_per_second
              expr: sum by (profile_id) (rate(dynamo_frontend_requests_total[2m]))
            # Worker pods answering on their system port.
            - record: cedana:inference_replicas
              expr: count by (profile_id) (up{job="inference"} == 1)
            - record: cedana:inference_running_requests
              expr: sum by (profile_id) (dynamo_frontend_inflight_requests)
            - record: cedana:inference_queued_requests
              expr: sum by (profile_id) (dynamo_frontend_queued_requests)
            # ">= 0" drops the NaN of a window with no requests.
            - record: cedana:inference_ttft_p95_seconds
              expr: histogram_quantile(0.95, sum by (profile_id, le) (rate(dynamo_frontend_time_to_first_token_seconds_bucket[2m]))) >= 0
            - record: cedana:inference_gpu_utilization
              expr: avg by (profile_id) (DCGM_FI_DEV_GPU_UTIL{profile_id!=""})
            - record: cedana:inference_gpu_memory_used_mib
              expr: sum by (profile_id) (DCGM_FI_DEV_FB_USED{profile_id!=""})
            - record: cedana:inference_gpus
              expr: count by (profile_id) (DCGM_FI_DEV_GPU_UTIL{profile_id!=""})
            - record: cedana:gpus_total
              expr: count(DCGM_FI_DEV_GPU_UTIL)
    prometheus.yml:
      rule_files:
        - /etc/config/recording_rules.yml
      # Replaces the chart's scrape-everything defaults. `collector` is the tag Cedana routes on.
      scrape_configs:
        - job_name: cadvisor
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
            - source_labels: [__meta_kubernetes_node_name]
              target_label: host
            - target_label: collector
              replacement: cadvisor
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: container_(cpu|memory)_.+
              action: keep
        - job_name: kube-state-metrics
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                own_namespace: true
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
              regex: kube-state-metrics;http
              action: keep
            - target_label: collector
              replacement: kube-state-metrics
        - job_name: dcgm
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                own_namespace: true
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
              regex: dcgm-exporter;metrics
              action: keep
            - source_labels: [__meta_kubernetes_pod_node_name]
              target_label: host
            - target_label: collector
              replacement: dcgm
          metric_relabel_configs:
            # Pod label the exporter copies from the pod using the GPU.
            - action: labelmap
              regex: inference_cedana_ai_profile_id
              replacement: profile_id
            - action: labeldrop
              regex: inference_cedana_ai_profile_id
        # Dynamo frontends serve request, token and latency metrics on their HTTP port.
        - job_name: inference-frontend
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_labelpresent_inference_cedana_ai_profile_id, __meta_kubernetes_pod_label_inference_cedana_ai_role, __meta_kubernetes_pod_container_port_name]
              regex: true;frontend;http
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_inference_cedana_ai_profile_id]
              target_label: profile_id
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: dynamo_frontend_(output_tokens_total|input_sequence_tokens_sum|requests_total|inflight_requests|queued_requests|time_to_first_token_seconds_bucket)
              action: keep
        # Worker system ports, scraped for `up` (cedana:inference_replicas).
        - job_name: inference
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_labelpresent_inference_cedana_ai_profile_id, __meta_kubernetes_pod_container_port_name]
              regex: true;system
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_inference_cedana_ai_profile_id]
              target_label: profile_id
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - target_label: collector
              replacement: inference

# Subchart: Vector, one agent per node (config in templates/metrics/vector-config.yaml).
vector:
  fullnameOverride: vector
  role: "Agent"
  # host_metrics must run on every node, GPU nodes included.
  tolerations:
    - operator: Exists
  env:
    - name: SPEC_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: CEDANA_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: vector-credentials
          key: cedanaAuthToken
  existingConfigMaps:
    - vector-config
  dataDir: "/vector-data"
  containerPorts:
    - name: prom-write
      containerPort: 9090
      protocol: TCP
  service:
    enabled: true
    ports:
      - name: prom-write
        port: 9090
        protocol: TCP
        targetPort: 9090
  defaultVolumes:
    - name: var-lib
      hostPath:
        path: "/var/lib/"
    - name: procfs
      hostPath:
        path: "/proc"
    - name: sysfs
      hostPath:
        path: "/sys"
  defaultVolumeMounts:
    - name: var-lib
      mountPath: "/var/lib"
      readOnly: true
    - name: procfs
      mountPath: "/host/proc"
      readOnly: true
    - name: sysfs
      mountPath: "/host/sys"
      readOnly: true
  persistence:
    hostPath:
      enabled: true
      path: "/var/lib/vector"

# Subchart: DCGM exporter, on nodes labeled by GPU feature discovery or the GPU operator.
dcgm-exporter:
  fullnameOverride: dcgm-exporter
  serviceMonitor:
    enabled: false
  tolerations:
    - operator: Exists
  kubernetes:
    enablePodLabels: true
    podLabelAllowlistRegex:
      - "^inference\\.cedana\\.ai/profile-id$"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values: ["true"]
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: Exists
