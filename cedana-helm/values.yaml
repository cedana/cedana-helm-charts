nameOverride: cedana
fullnameOverride: cedana

# Install the following CRDs before setting installKueue as true
# kubectl apply --server-side -f https://github.com/kubernetes-sigs/kueue/releases/download/v0.10.1/manifests.yaml
installKueue: false

config:
  authToken:
  url:
  clusterId:
  sqsQueueUrl:

  # Specify the address and port to bind the daemon on
  #
  # Address has to be 0.0.0.0 for the service to be externally addressable,
  # if you don't want it to be feel free to update, it ideally won't affect stability
  #
  # Default: 0.0.0.0:8080
  address: 0.0.0.0:8080
  # Specify the protocol to use for daemon service
  # Default: tcp (other protocols might not be supported properly, update with caution)
  # Options:
  # - tcp: TCP socket
  # - unix: Unix Socket
  # - vsock: VSock for VM and hypervisor communication, useful for supporting VM based migrations
  protocol: tcp

  # Specify path to directory for storing checkpoints.
  # - `cedana://<path>` for Cedana-managed global storage (recommended)
  # - `s3://<bucket>/<path>` for your S3 storage
  # - `<path>` for node-local storage (not recommended, as it won't be accessible across nodes)
  checkpointDir: /tmp
  # Specify the number of parallel streams to use for streaming checkpoint/restore operations.
  # 0 means no streaming. n > 0 means n parallel streams (or number of pipes) to use.
  # Streaming ensures a low footprint by using memory efficiently with no intermediate
  # disk space required, although performance may be slightly better or worse depending on disk and network read/write speeds.
  checkpointStreams: 0
  # Specify the maximum memory (RAM) allowed for checkpoint streaming.
  checkpointStreamMemoryLimit: 4096 # 4 GiB
  checkpointCompression: none # Options: "none", "tar", "lz4", "gzip", "zlib"
  # Specify whether to perform checkpoint compression/upload async. Recommended if anticipating large checkpoints,
  # which could take too long to stream directly to a bucket. Note that restore will only be possible after upload is complete,
  # so there might be a delay before a workload can be restored even though the checkpoint shows as complete.
  checkpointAsync: false

  gpuPoolSize: 0 # Number of GPU controllers to keep warm. Improves GPU workload startup/restore time but uses more memory.
  gpuShmSize: "8589934592" # 8 GiB. Enough for most workloads. Reduce if memory constrained or running small workloads only.
  gpuDedupEnabled: true # Enable deduplication for GPU checkpoints to reduce checkpoint size.
  gpuTemplatesEnabled: false # Enable templates for GPU checkpoint/restore.

  # Specify the plugin versions to use. If pluginsBuilds is "release", then any release version
  # for the plugins can be specified. If pluginsBuilds is "alpha", then specify the branch name.
  pluginsBuilds: release
  pluginsCriuVersion: v4.2-cedana.01
  pluginsContainerdRuntimeVersion: v0.7.5
  pluginsGpuVersion: v0.7.3
  pluginsStreamerVersion: v0.1.0
  # Directory on the host that `cedana plugin install` searches before hitting the
  # registry. Set this together with a helper image that bakes plugin artifacts
  # into the same path; leave empty to always download from the registry.
  pluginsLocalSearchPath: ""
  # Register the daemon's host record with the propagator. Requires a
  # propagator that serves the /hosts API; set false against one that does not.
  dbRemote: true

  profiling: true
  metrics: true
  logLevel: info

  awsAccessKeyId: # AWS access key ID if using S3 storage (if `s3://<bucket>/<path>` in checkpointDir)
  awsSecretAccessKey: # AWS secret access key if using S3 storage
  # AWS credential provider: static, eksPodIdentity, or ambient
  awsCredentialsMode: static
  awsRegion: # AWS region if using S3 storage (uses default region if not set)
  awsEndpoint: # AWS endpoint if using S3-compatible storage

  criuLogLevel: 2
  # Uncomment, to use custom pre-existing secret
  # preExistingSecret: cedana-secret-user

hostConfig:
  containerdAddress: /run/containerd/containerd.sock # Path to containerd socket
  # Cedana does not support io-uring based checkpoint restores
  # Set ioUring to false to disable linux kernel's io-uring option
  disableIoUring: true
  # Optional configuration to increase /dev/shm size on nodes
  # This is useful for workloads that require large shared memory
  shmConfig:
    enabled: false # Set to true to enable /dev/shm size increase
    size: 10G # Size to set for /dev/shm (e.g., "10G", "20G")
    minSize: 10G # Minimum size to trigger remount (e.g., "10G", "20G")
  # /checkpoint as tmpfs — the "memory" storage tier for Cedana checkpoints.
  #
  # Restoring from RAM is what avoids a cold weight load, which measures eleven
  # minutes from block storage for a 27B FP8 model. The trade is that a tmpfs
  # checkpoint dies with the node, so this tier serves model swaps on a live node
  # and cannot serve recovery from node loss.
  #
  # Off by default: tmpfs pages are charged to node memory and compete with the
  # workload, so only enable it on nodes that actually host checkpointed
  # workloads. The setup script refuses a size above 80% of host RAM rather than
  # clamping it, because a silently smaller mount surfaces as a checkpoint failing
  # part-written.
  checkpointTmpfs:
    enabled: false
    size: 50G # Must hold a full checkpoint; a 27B FP8 model is ~30GB
    mode: "1777" # Written by the shim, possibly read by a differently-owned restore

daemonHelper:
  # Deploy the helper DaemonSets (and the health-check DaemonSet). Set false
  # when only the dynamo-watcher is wanted (e.g. a watcher-only release).
  enabled: true
  serviceAccount:
    # Create a dedicated ServiceAccount for the S3-using helper DaemonSets.
    create: true
    name: cedana-helper
    automount: false
    annotations: {}
  service:
    annotations: {}
  image:
    repository: cedana/cedana-helper
    tag: v0.9.297
    digest: # ignores tag if set
    imagePullPolicy: IfNotPresent
  updateStrategy:
    maxSurge: 0
    maxUnavailable: 99999
  tolerations:
    # Allow scheduling on nodes that are waiting for Cedana to be ready
    - key: "cedana.ai/not-ready"
      operator: "Exists"
      effect: "NoSchedule"
  affinity: {}
  # Restrict Cedana to labeled nodes; the controller taints only these nodes.
  #   kubectl label nodes <node-name> cedana.ai/enabled=true
  #   nodeSelector: { cedana.ai/enabled: "true" }
  # Empty = all nodes (default).
  nodeSelector: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: cedana-controller-manager

controllerManager:
  # Deploy the controller manager (and its RBAC/metrics/leader-election
  # resources). Set false when only the dynamo-watcher is wanted.
  enabled: true
  # Whether the controller manages the cedana.ai/not-ready taint (gates workloads
  # off a node until Cedana is ready). Set false to manage node readiness yourself;
  # the controller then never adds or removes the taint.
  taintNodes: true
  autoscaling:
    enabled: false
    replicaCount: 1
    deploymentRevisionHistoryLimit: 10
  service:
    annotations: {}
    ports:
      - protocol: TCP
        port: 1324
        targetPort: 1324
  manager:
    podAnnotations: {}
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    containerSecurityContext:
      # controller doesn't require any privileges
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      repository: cedana/cedana-controller
      tag: v0.6.5
      digest: # ignores tag if set
      imagePullPolicy: IfNotPresent
    resources:
      # empty to ensure minimal resource
      # usage on demo/test deployments
      # uncomment or add custom resource
      # limits:
      #   cpu: 500m
      #   memory: 128Mi
      # requests:
      #   cpu: 10m
      #   memory: 64Mi
  rbac:
    resources:
      # empty to ensure minimal resource
      # usage on demo/test deployments
      # uncomment or add custom resource
      # limits:
      #   cpu: 500m
      #   memory: 128Mi
      # requests:
      #   cpu: 10m
      #   memory: 64Mi
  tolerations:
    # Allow scheduling on nodes that are waiting for Cedana to be ready
    - key: "cedana.ai/not-ready"
      operator: "Exists"
      effect: "NoSchedule"
    # Run the command below to deploy the controller on a dedicated node
    # This will not allow shceduling of new pods on the node running the controller pod
    # kubectl taint node <node-name> dedicated=cedana-manager:NoSchedule
    # - key: "dedicated"
    #   operator: "Equal"
    #   value: "cedana-manager"
    #   effect: "NoSchedule"
  affinity:
    # Allow scheduling of controller pod on the labeled node only
    # kubectl label nodes <node-name> dedicated=cedana-manager
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: "dedicated"
    #             operator: "In"
    #             values:
    #               - "cedana-manager"
  nodeSelector: {}

# dynamo-watcher: standalone component that watches DynamoGraphDeployments and
# dynamo Services, syncs their status to the Cedana propagator, and consumes the
# cluster's RabbitMQ create/delete workload queues. Only relevant on clusters that
# have NVIDIA Dynamo installed, so it is opt-in (disabled by default).
#
# It also runs the CPU inference lifecycle controller as a leader-elected loop in
# `inferenceNamespace` (see INFERENCE_NAMESPACE).
dynamoWatcher:
  enabled: false
  # Create a LoadBalancer Service for dynamo frontends (sets CEDANA_DYNAMO_CREATE_LB).
  createLoadBalancer: false
  # Namespace holding CPU inference Deployments reconciled by the built-in
  # inference controller (sets INFERENCE_NAMESPACE).
  inferenceNamespace: cedana-inference
  # GPU inference experiments: the watcher creates an owned DynamoGraphDeployment
  # (NVIDIA Dynamo v1.1.1) per dynamo-hosted experiment and deletes it when the
  # experiment reaches a terminal state, releasing GPU capacity. The cluster must
  # have the Dynamo CRDs/operator installed and GPU nodes matching the selector
  # below; the reconciler stays idle otherwise.
  experiments:
    # GPU nodes must carry this label/value to accept experiment workers.
    gpuNodeSelector: {}
    # Tolerations appended to experiment worker pods (e.g. nvidia.com/gpu).
    gpuTolerations: []
    # Retain the validated checkpoint artifact after an experiment completes;
    # worker compute and routing are always released.
    retainArtifactByDefault: false
  replicaCount: 1
  podAnnotations: {}
  image:
    repository: cedana/cedana-dynamo-watcher
    # Keep in lockstep with controllerManager.manager.image.tag (same repo release).
    tag: v0.6.4
    digest: # ignores tag if set
    imagePullPolicy: IfNotPresent
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  tolerations:
    # Allow scheduling on nodes that are waiting for Cedana to be ready
    - key: "cedana.ai/not-ready"
      operator: "Exists"
      effect: "NoSchedule"

# Gate the remaining cluster-scoped components of the chart so a watcher-only
# (or manager-only) release does not collide with an existing full release.
healthCheck:
  enabled: true
runtimeClass:
  enabled: true
uninstaller:
  enabled: true
  affinity: {}

kubernetesClusterDomain: cluster.local

metricsService:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: https
  type: ClusterIP
