# Token Factory: Cedana's node components wired to the in-cluster spoke, with no hosted propagator.
# Install the token-factory chart first: node setup looks up its spoke Service. Then:
#   helm install cedana ./cedana-helm -n cedana-system --create-namespace \
#     -f cedana-helm/values-token-factory.yaml \
#     --set config.authToken=$TOKEN --set config.clusterId=$CLUSTER_ID --set csx.nfsPath=$SHARED_DIR
# $TOKEN is shared with the token-factory chart (its agentToken). Add --set config.url=<cedana-url>
# to download plugins from Cedana; without it (airgapped) the helper image must carry them.
tokenFactory:
  enabled: true

config:
  gpuDedupEnabled: true
  # Checkpoints go through CSX so any node can restore them.
  checkpointDir: "csx://"

csx:
  # The 1000 GiB default outgrows GPU nodes' boot disks; past it kubelet evicts Cedana itself.
  localDiskCacheLimit: 100
