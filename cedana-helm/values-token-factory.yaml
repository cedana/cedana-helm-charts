# Token Factory: Cedana's node components wired to the in-cluster spoke, with no hosted propagator.
# Install the token-factory chart first: node setup looks up its spoke Service. Then:
#   helm install cedana ./cedana-helm -n cedana-system --create-namespace \
#     -f cedana-helm/values-token-factory.yaml \
#     --set config.authToken=$TOKEN --set config.clusterId=$CLUSTER_ID --set config.url=$CEDANA_URL \
#     --set csx.nfsPath=$SHARED_DIR
# $TOKEN and $CEDANA_URL are shared with the token-factory chart (its agentToken and url).
tokenFactory:
  enabled: true

config:
  gpuDedupEnabled: true
  # Cluster metrics ship to the hosted propagator.
  metrics: false
  # Checkpoints go through CSX so any node can restore them.
  checkpointDir: "csx://"

csx:
  # The 1000 GiB default outgrows GPU nodes' boot disks; past it kubelet evicts Cedana itself.
  localDiskCacheLimit: 100

# Re-registers restored workers with Dynamo discovery (a woken model's frontend sees none without it).
# Only this loop: the others need RabbitMQ.
dynamoWatcher:
  enabled: true
  loops: "worker-metadata"
