name: Release

# Releases are made by cedana-marshal: its release suite tests the chart at the release PR head, and
# after merging, its release-publish pushes this tag. So a tag only checks and publishes the chart
# (OCI + GitHub release); marshal posts one combined release summary.

permissions:
  contents: write
  packages: write
  actions: write
  id-token: write
  pull-requests: write
  checks: write

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      debug_publish:
        type: boolean
        description: "Run publish with debugging enabled"
        required: false
        default: false

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      helm: true
      version: true

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: check
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      github: true
      dockerhub: true
      post_summary: false
