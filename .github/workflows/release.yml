name: Release

# Releases are made by cedana-marshal: its release suite tests the chart at the release PR head, and
# after merging, its release-publish pushes this tag. So a tag only checks and publishes the chart
# (OCI + GitHub release); marshal posts one combined release summary.

permissions:
  contents: write
  packages: write
  actions: write
  id-token: write
  pull-requests: write
  checks: write

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      debug_publish:
        type: boolean
        description: "Run publish with debugging enabled"
        required: false
        default: false

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      helm: true
      version: true

  # Never publish a chart pinning something unreleased (e.g. a hand-made tag, or a component that
  # wasn't promoted): every cedana image tag must exist under its release name, and every plugin
  # version in the channel the chart installs from
  verify:
    name: Verify pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Verify
        env:
          CEDANA_URL: ${{ vars.CEDANA_URL }}
          CEDANA_AUTH_TOKEN: ${{ secrets.CEDANA_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          VALUES=cedana-helm/values.yaml
          fail=0

          images=$(yq -r '.. | select(tag == "!!map" and has("repository") and has("tag")) | select(.repository | test("^cedana/")) | .repository + ":" + .tag' "$VALUES")
          images="$images cedana/cedana-propagator:v$(yq -r .appVersion cedana-helm/Chart.yaml)"
          for image in $images; do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Found $image"
            else
              echo "::error::$image doesn't exist"
              fail=1
            fi
          done

          # The chart installs plugins from this channel
          BUILD=$(yq -r '.config.pluginsBuilds // "release"' "$VALUES")
          [ "$BUILD" != release ] || BUILD=""
          CEDANA=$(yq -r .daemonHelper.image.tag "$VALUES")
          plugins="libcedana-k8s.so=$CEDANA libcedana-runc.so=$CEDANA libcedana-containerd.so=$CEDANA
            criu=$(yq -r .config.pluginsCriuVersion "$VALUES")
            libcedana-gpu.so=$(yq -r .config.pluginsGpuVersion "$VALUES")
            cedana-image-streamer=$(yq -r .config.pluginsStreamerVersion "$VALUES")
            cedana-shim-runc-v2=$(yq -r .config.pluginsContainerdRuntimeVersion "$VALUES")"
          for plugin in $plugins; do
            file=${plugin%%=*}
            version=${plugin#*=}
            url="${CEDANA_URL}/plugins/download/${file}?version=${version}&arch=amd64&build=${BUILD}&exact=true"
            # Retry: the propagator occasionally refuses a request (e.g. a 401), for no reason
            for _ in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CEDANA_AUTH_TOKEN" "$url") || code=000
              case $code in 302 | 404) break ;; esac
              sleep 2
            done
            case $code in
              302) echo "Found $file $version" ;;
              404) echo "::error::$file $version isn't in the ${BUILD:-release} channel"; fail=1 ;;
              *) echo "::error::$file $version: the propagator returned $code"; fail=1 ;;
            esac
          done
          exit "$fail"

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: [check, verify]
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      github: true
      dockerhub: true
      post_summary: false
