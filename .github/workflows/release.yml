name: Release

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write
  pull-requests: write
  checks: write

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      debug_test:
        type: boolean
        description: "Run tests with debugging enabled"
        required: false
        default: false
      debug_publish:
        type: boolean
        description: "Run publish with debugging enabled"
        required: false
        default: false

# Shared with push.yml: a release of this commit cancels an in-progress push.
concurrency:
  group: ${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      helm: true
      version: true

  prepare:
    name: Prepare
    uses: ./.github/workflows/prepare.yml
    needs: check
    secrets: inherit

  download:
    name: Download
    uses: cedana/cedana/.github/workflows/download.yml@main
    needs: prepare
    secrets: inherit
    with:
      cedana_version: ${{ needs.prepare.outputs.cedana_version }}
      controller_version: ${{ needs.prepare.outputs.controller_version }}
      containerd_runtime_version: ${{ needs.prepare.outputs.containerd_runtime_version }}
      criu_version: ${{ needs.prepare.outputs.criu_version }}
      gpu_version: ${{ needs.prepare.outputs.gpu_version }}
      streamer_version: ${{ needs.prepare.outputs.streamer_version }}

  test:
    name: Test
    uses: cedana/cedana/.github/workflows/test_k8s.yml@main
    needs: [prepare, download]
    secrets: inherit
    with:
      ref: main
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug }}
      platforms: '["K3s", "EKS", "GKE"]'
      post_summary: true

  publish:
    name: Publish
    uses: ./.github/workflows/publish.yml
    needs: test
    secrets: inherit
    with:
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug_publish }}
      github: true
      dockerhub: true
      post_summary: true

  # A push that queued behind this release (tag event processed before the
  # branch event) would otherwise run once the release finishes.
  cancel_push:
    name: Cancel push
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel push runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow push.yml --commit "$GITHUB_SHA" \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' |
            xargs -r -n1 gh run cancel --repo "$GITHUB_REPOSITORY"
