name: Check

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      helm:
        type: boolean
        description: "Check helm charts"
        required: false
        default: false
      version:
        type: boolean
        description: "Check version"
        required: false
        default: false

jobs:
  helm:
    name: Helm
    runs-on: ubuntu-latest
    if: inputs.helm
    steps:
      - uses: actions/checkout@v3

      - name: Lint helm chart
        run: |
          helm lint cedana-helm

      - name: Render the csx templates
        # Only rendered with checkpointDir csx://, which the lint's defaults do not use
        run: |
          for checksum in true false; do
            rendered=$(helm template cedana cedana-helm \
              --set config.checkpointDir=csx:// --set csx.nfsPath=/nfs \
              --set config.clusterId=check --set config.authToken=check --set config.url=http://check \
              --set csx.checksum=$checksum --set dynamoWatcher.enabled=true)
            echo "$rendered" | grep -q "csx-checksum: \"$checksum\"" || { echo "csx-checksum: \"$checksum\" missing from the csx ConfigMap"; exit 1; }
            echo "$rendered" | grep -q "name: CEDANA_CSX_CHECKSUM" || { echo "CEDANA_CSX_CHECKSUM missing from the csx DaemonSet"; exit 1; }
            # The inference controller runs in the dynamo-watcher and dumps into the same directory as the helper
            echo "$rendered" | awk '/^# Source: .*dynamo-watcher-deployment.yaml/,/^---$/' | grep -q "name: CEDANA_CHECKPOINT_DIR" || { echo "CEDANA_CHECKPOINT_DIR missing from the dynamo-watcher Deployment"; exit 1; }
          done
          # A change of checkpoint directory must roll the watcher, which reads it once at start
          watcher_checksum() {
            helm template cedana cedana-helm --set config.checkpointDir=$1 --set csx.nfsPath=/nfs \
              --set config.clusterId=check --set config.authToken=check --set config.url=http://check \
              --set dynamoWatcher.enabled=true | awk '/^# Source: .*dynamo-watcher-deployment.yaml/,/^---$/' | grep "checksum/config:"
          }
          if [ "$(watcher_checksum csx://)" = "$(watcher_checksum /tmp)" ]; then
            echo "the dynamo-watcher's checksum/config annotation does not change with the checkpoint directory"; exit 1
          fi

  version:
    name: Version
    runs-on: ubuntu-latest
    if: inputs.version
    steps:
      - uses: actions/checkout@v4

      - name: Write release version
        id: version
        run: |
          VERSION=${{ github.head_ref || github.ref_name }}
          # strip v
          echo Version: ${VERSION#v}
          echo "VERSION=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Check helm versions
        run: |
          grep -qF '${{ steps.version.outputs.VERSION }}' cedana-helm/Chart.yaml || (echo "update the version field in cedana-helm/Chart.yaml"; exit 1)
