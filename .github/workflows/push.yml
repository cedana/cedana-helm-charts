name: Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: "Run with debugging enabled"
        required: false
        default: false

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tagged commit is a release: the release workflow runs instead of this one.
  check_release:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tags.outputs.release }}
    steps:
      - name: Check if commit is tagged
        id: tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" | grep -q "^$GITHUB_SHA"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Prepare
    needs: check_release
    if: needs.check_release.outputs.release != 'true'
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  download:
    name: Download
    uses: cedana/cedana/.github/workflows/download.yml@main
    needs: prepare
    secrets: inherit
    with:
      cedana_version: ${{ needs.prepare.outputs.cedana_version }}
      controller_version: ${{ needs.prepare.outputs.controller_version }}
      containerd_runtime_version: ${{ needs.prepare.outputs.containerd_runtime_version }}
      criu_version: ${{ needs.prepare.outputs.criu_version }}
      gpu_version: ${{ needs.prepare.outputs.gpu_version }}
      streamer_version: ${{ needs.prepare.outputs.streamer_version }}

  test:
    name: Test
    uses: cedana/cedana/.github/workflows/test_k8s.yml@main
    needs: [prepare, download]
    secrets: inherit
    with:
      ref: main
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug }}
      platforms: '["K3s", "EKS", "GKE"]'
      post_summary: true
