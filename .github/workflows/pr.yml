name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Runs on marshal's release PRs too: it only lints, and Check / Helm is a required check
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      helm: true
      version: false

