name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: "Run with debugging enabled"
        required: false
        default: false

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Marshal's release PRs pin tags that are only on the alpha channel until its release suite
    # promotes them, so this CI fails by design; their status is marshal/release-suite
    if: github.event.pull_request.user.login != 'cedana-marshal[bot]' && !contains(github.event.pull_request.labels.*.name, 'marshal-release')
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      helm: true
      version: false

  prepare:
    name: Prepare
    # Marshal's release PRs pin tags that are only on the alpha channel until its release suite
    # promotes them, so this CI fails by design; their status is marshal/release-suite
    if: github.event.pull_request.user.login != 'cedana-marshal[bot]' && !contains(github.event.pull_request.labels.*.name, 'marshal-release')
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  download:
    name: Download
    uses: cedana/cedana/.github/workflows/download.yml@main
    needs: prepare
    secrets: inherit
    with:
      cedana_version: ${{ needs.prepare.outputs.cedana_version }}
      controller_version: ${{ needs.prepare.outputs.controller_version }}
      containerd_runtime_version: ${{ needs.prepare.outputs.containerd_runtime_version }}
      criu_version: ${{ needs.prepare.outputs.criu_version }}
      gpu_version: ${{ needs.prepare.outputs.gpu_version }}
      streamer_version: ${{ needs.prepare.outputs.streamer_version }}

  test:
    name: Test
    uses: cedana/cedana/.github/workflows/test_k8s.yml@main
    needs: [prepare, download]
    secrets: inherit
    with:
      ref: main
      debug: ${{ startsWith(github.event_name, 'workflow') && inputs.debug }}
      platforms: '["K3s", "EKS", "GKE"]'
      post_summary: true
