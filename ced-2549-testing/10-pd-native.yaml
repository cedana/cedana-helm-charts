apiVersion: v1
kind: Pod
metadata:
  name: cedana-glm53-pd-prefill
  namespace: default
  labels:
    together.ai/cedana-eval: "true"
    together.ai/cedana-pd: glm53
    together.ai/cedana-pd-role: prefill
  annotations:
    together.ai/source-revision: togethercomputer/together-dynamo@1a4796f903984d601991fa14d7444fe73edc466a
    together.ai/model-artifact: togethercomputer/GLM-5.3-TQuark-C2P-GPTQ-NVFP4@a1e9d28594bc905c89261ffc01fd0c4a8232252a
spec:
  serviceAccountName: cedana-tester
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: gpu-dp-ckck8-4pcmf
  terminationGracePeriodSeconds: 300
  containers:
  - image: 598726163780.dkr.ecr.us-west-2.amazonaws.com/smg@sha256:a81eebc35ed6581ca886e8f8912e97957b1101359a509f27d29e0d479f60e0de
    imagePullPolicy: Never
    command:
    - python3
    - -u
    - /opt/glm53-tools/launch.py
    args:
    - --role
    - prefill
    - --gpu-prelude
    - --
    - python3
    - -u
    - -m
    - dynamo.vllm
    - --model
    - /data/modelpreload/huggingface/models--togethercomputer--GLM-5.3-TQuark-C2P-GPTQ-NVFP4/snapshots/a1e9d28594bc905c89261ffc01fd0c4a8232252a
    - --served-model-name
    - cedana-eval-glm53-pd
    - --block-size
    - '64'
    - --cpu-distributed-timeout-seconds
    - '600'
    - --disaggregation-mode
    - prefill
    - --dyn-reasoning-parser
    - glm45
    - --dyn-tool-call-parser
    - glm47
    - --enable-chunked-prefill
    - --enable-prefix-caching
    - --gpu-memory-utilization
    - '0.88'
    - --jit-monitor-verbose
    - --kernel-config
    - '{"enable_flashinfer_autotune":false}'
    - --kv-cache-dtype
    - fp8
    - --language-model-only
    - --load-format
    - auto
    - --long-prefill-token-threshold
    - '16384'
    - --max-model-len
    - '1048576'
    - --max-num-batched-tokens
    - '65472'
    - --max-num-seqs
    - '16'
    - --no-disable-hybrid-kv-cache-manager
    - --safetensors-load-strategy
    - prefetch
    - --shutdown-timeout
    - '300'
    - --speculative-config
    - '{"method":"mtp","num_speculative_tokens":5}'
    - --tensor-parallel-size
    - '8'
    - --trust-remote-code
