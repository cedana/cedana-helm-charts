---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: policies.tokenfactory.cedana.ai
spec:
  group: tokenfactory.cedana.ai
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    shortNames:
    - tfp
    singular: policy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.order
      name: Order
      type: integer
    - jsonPath: .status.matchedModels
      name: Models
      type: integer
    - jsonPath: .spec.park.after
      name: Park after
      type: string
    - jsonPath: .spec.gpus.budget
      name: GPU budget
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PolicySpec says how the models it governs scale, wake, park and share GPUs.

              Each model is governed by one policy: the first in its namespace, by order (then name), whose
              match it fits. What that policy leaves unset uses the built-in defaults.
            properties:
              gpus:
                properties:
                  budget:
                    description: GPUs all the policy's models may hold together.
                    format: int32
                    minimum: 0
                    type: integer
                  priority:
                    description: Higher takes GPUs from idle lower-priority models.
                    format: int32
                    type: integer
                type: object
              match:
                description: Empty matches every model in the namespace.
                properties:
                  labels:
                    additionalProperties:
                      type: string
                    description: Every label must match.
                    type: object
                  models:
                    description: Model names in the namespace.
                    items:
                      type: string
                    type: array
                type: object
              order:
                description: Position in the namespace's list; lower comes first.
                format: int32
                type: integer
              park:
                description: A string the spoke can't decode as a duration would stop
                  its policy watch, so it never gets in.
                properties:
                  after:
                    description: Idle time before parking, as a Go duration (90s,
                      5m, 1h30m).
                    type: string
                  never:
                    description: Keep the model up however long it idles.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: set after or never, not both
                  rule: '!(has(self.after) && has(self.never) && self.never)'
                - message: park.after must be a duration like 90s, 5m or 1h30m
                  rule: '!has(self.after) || self.after.matches(''^(0|([0-9]+([.][0-9]+)?(ns|us|µs|ms|s|m|h))+)$'')'
              scale:
                properties:
                  perReplica:
                    description: In-flight requests per replica before adding one.
                    format: int32
                    minimum: 1
                    type: integer
                  replicas:
                    properties:
                      max:
                        format: int32
                        minimum: 1
                        type: integer
                      min:
                        description: 0 lets the model park.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                type: object
                x-kubernetes-validations:
                - message: replicas.min must not exceed replicas.max
                  rule: '!has(self.replicas) || !has(self.replicas.min) || !has(self.replicas.max)
                    || self.replicas.min <= self.replicas.max'
              wake:
                properties:
                  queue:
                    description: Requests held while the model wakes; more are refused.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              matchedModels:
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
