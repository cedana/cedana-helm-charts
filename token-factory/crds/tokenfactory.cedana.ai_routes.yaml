---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: routes.tokenfactory.cedana.ai
spec:
  group: tokenfactory.cedana.ai
  names:
    kind: Route
    listKind: RouteList
    plural: routes
    shortNames:
    - tfr
    singular: route
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Serves
      type: string
    - jsonPath: .spec.provider.name
      name: Provider
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Route is how one model name callers send is served.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RouteSpec serves one model name callers send (gpt-4.1, claude-sonnet-4-5) from an outside
              provider, from Models in the namespace, or a share of each. Callers keep their client and
              change only its base URL.
            properties:
              fallback:
                description: |-
                  What a request shifted to a model with no ready replica does: provider serves it while
                  the model wakes, queue waits for the wake. Defaults to provider when there is one.
                enum:
                - provider
                - queue
                type: string
              name:
                description: The model name callers send. One route per name in the
                  cluster.
                minLength: 1
                type: string
              provider:
                description: Where requests no shift takes go.
                properties:
                  model:
                    description: The model name the provider is called with. Defaults
                      to the route's name.
                    type: string
                  name:
                    description: A provider Switchyard is configured with, e.g. openai
                      or anthropic. Its key stays there.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              shift:
                description: |-
                  Shares of requests sent to Models in the namespace. Without a provider the percents are
                  relative weights.
                items:
                  properties:
                    keys:
                      description: Only requests from these API keys shift; empty
                        means every key.
                      items:
                        type: string
                      maxItems: 64
                      type: array
                    percent:
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    to:
                      description: A Model in the route's namespace.
                      minLength: 1
                      type: string
                  required:
                  - percent
                  - to
                  type: object
                maxItems: 16
                type: array
            required:
            - name
            type: object
            x-kubernetes-validations:
            - message: set a provider, a shift, or both
              rule: has(self.provider) || (has(self.shift) && size(self.shift) > 0)
            - message: shift percents must add up to at most 100
              rule: '!has(self.shift) || self.shift.map(s, s.percent).sum() <= 100'
            - message: 'fallback: provider needs a provider'
              rule: '!has(self.fallback) || self.fallback != ''provider'' || has(self.provider)'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
