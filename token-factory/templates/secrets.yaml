apiVersion: v1
kind: Secret
metadata:
  name: tokenfactory-agent
  labels: {{- include "token-factory.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ required "Please provide --set agentToken=<cedana-helm's config.authToken>" .Values.agentToken | b64enc | quote }}
---
# Gateways present this to the spoke; generated once and kept across upgrades.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "tokenfactory-gateway" }}
apiVersion: v1
kind: Secret
metadata:
  name: tokenfactory-gateway
  labels: {{- include "token-factory.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
